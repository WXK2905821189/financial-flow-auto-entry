# 财务流水自动入账 · 一期 MVP 演示栈
# 一条命令拉起：测试银行 → 数据中台(采集/校验/复核) → 测试金蝶 的完整数据流动闭环
# 用法：docker compose up --build   （浏览器打开 http://localhost:8080 观看演示）

services:
  mysql:
    image: mysql:8.0
    container_name: mvp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mvp_root_pw
      MYSQL_DATABASE: midvault
    ports:
      - "33061:3306"            # 宿主可连；容器间用内网 midvault 库
    volumes:
      - mvp_mysql_data:/var/lib/mysql
      - ./platform/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmvp_root_pw"]
      interval: 5s
      timeout: 3s
      retries: 20

  bank-mock:
    build: ./bank-mock
    container_name: mvp-bank
    environment:
      PORT: 8100
    expose:
      - "8100"

  platform:
    build: ./platform
    container_name: mvp-platform
    environment:
      PORT: 8000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: mvp_root_pw
      MYSQL_DB: midvault
      BANK_URL: http://bank-mock:8100
      KINGDEE_URL: http://kingdee-mock:8200
      # 演示用复核/操作账号（MVP 简版角色，仅本地演示）
      DEMO_AUDITOR: cnxiao
    ports:
      - "8080:8000"             # 演示入口
    depends_on:
      mysql:
        condition: service_healthy

  kingdee-mock:
    build: ./kingdee-mock
    container_name: mvp-kingdee
    environment:
      PORT: 8200
    expose:
      - "8200"

volumes:
  mvp_mysql_data: