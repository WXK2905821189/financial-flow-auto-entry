<svg xmlns="http://www.w3.org/2000/svg" width="980" height="820" viewBox="0 0 980 820" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f3a68"/><stop offset="1" stop-color="#2f5f9e"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <rect width="980" height="820" fill="url(#bg)"/>
  <rect width="980" height="54" fill="url(#head)"/>
  <text x="490" y="34" text-anchor="middle" fill="#fff" font-size="19" font-weight="600">财务流水自动入账 · 一期技术架构</text>

  <!-- ============ 外部 / 周边 ============ -->
  <rect x="40" y="86" width="900" height="96" rx="10" fill="#eef4fb" stroke="#7fa7d4" stroke-dasharray="5,4" filter="url(#shadow)"/>
  <text x="60" y="112" fill="#2f5f9e" font-size="13" font-weight="600">外部 / 周边（一期演示以模拟为主）</text>

  <rect x="70" y="128" width="330" height="40" rx="8" fill="#fff" stroke="#b6cfe8"/>
  <text x="86" y="147" fill="#334" font-size="12.5" font-weight="600">银企采集（模拟/内网）</text>
  <text x="86" y="162" fill="#778" font-size="11">mock_bank_api :8080 · 招商/中信 · 分页 · MD5 验签</text>

  <rect x="580" y="128" width="330" height="40" rx="8" fill="#fff" stroke="#b6cfe8"/>
  <text x="596" y="147" fill="#334" font-size="12.5" font-weight="600">金蝶云星空 OpenAPI</text>
  <text x="596" y="162" fill="#778" font-size="11">凭据未就绪 → 当前 Mock 推送 · 官方 Python SDK 备选</text>

  <!-- ============ 数据中台 ============ -->
  <rect x="40" y="216" width="900" height="330" rx="10" fill="#ffffff" stroke="#5b7fb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="60" y="242" fill="#1f3a68" font-size="14" font-weight="700">数据中台 · backend/（FastAPI · Python 3.10 · JWT）</text>

  <!-- adapters -->
  <rect x="70" y="258" width="840" height="58" rx="8" fill="#eef4fb" stroke="#b6cfe8"/>
  <text x="84" y="278" fill="#2f5f9e" font-size="12" font-weight="600">采集适配层 adapters（可插拔 · 注册表）</text>
  <rect x="84" y="286" width="180" height="22" rx="5" fill="#fff" stroke="#b6cfe8"/><text x="174" y="301" text-anchor="middle" fill="#446" font-size="11">MockAdapter</text>
  <rect x="280" y="286" width="180" height="22" rx="5" fill="#fff" stroke="#b6cfe8"/><text x="370" y="301" text-anchor="middle" fill="#446" font-size="11">FileAdapter（导入）</text>
  <rect x="476" y="286" width="180" height="22" rx="5" fill="#ffeedd" stroke="#e3b57a"/><text x="566" y="301" text-anchor="middle" fill="#8a5a22" font-size="11">ApiAdapter · HTTP</text>

  <!-- services -->
  <rect x="70" y="330" width="840" height="150" rx="8" fill="#f4f8ff" stroke="#c3d4ee"/>
  <text x="84" y="350" fill="#2f5f9e" font-size="12" font-weight="600">中台业务服务 services（领域规则 · 不依赖 HTTP）</text>
  <rect x="84" y="360" width="196" height="46" rx="6" fill="#fff" stroke="#b6cfe8"/>
  <text x="182" y="380" text-anchor="middle" fill="#334" font-size="11.5" font-weight="600">ingest.py · 批次落库</text>
  <text x="182" y="396" text-anchor="middle" fill="#778" font-size="10.5">R001去重→R002-R006校验→科目预填</text>
  <rect x="294" y="360" width="196" height="46" rx="6" fill="#fff" stroke="#b6cfe8"/>
  <text x="392" y="380" text-anchor="middle" fill="#334" font-size="11.5" font-weight="600">validation.py · 规则引擎</text>
  <text x="392" y="396" text-anchor="middle" fill="#778" font-size="10.5">R001–R006 · 批次勾稽</text>
  <rect x="504" y="360" width="196" height="46" rx="6" fill="#fff" stroke="#b6cfe8"/>
  <text x="602" y="380" text-anchor="middle" fill="#334" font-size="11.5" font-weight="600">account_mapper.py</text>
  <text x="602" y="396" text-anchor="middle" fill="#778" font-size="10.5">科目预填（决策 P1）</text>
  <rect x="714" y="360" width="196" height="46" rx="6" fill="#fff" stroke="#b6cfe8"/>
  <text x="812" y="380" text-anchor="middle" fill="#334" font-size="11.5" font-weight="600">push / kingdee.py · 制证</text>
  <text x="812" y="396" text-anchor="middle" fill="#778" font-size="10.5">金蝶推送 · 当前 Mock</text>
  <rect x="84" y="418" width="196" height="46" rx="6" fill="#fff" stroke="#b6cfe8"/>
  <text x="182" y="435" text-anchor="middle" fill="#334" font-size="11.5" font-weight="600">review.py · 复核状态机</text>
  <text x="182" y="451" text-anchor="middle" fill="#778" font-size="10.5">FAIL→LOADED 放行 · WARN 转人工</text>
  <rect x="294" y="418" width="196" height="46" rx="6" fill="#fff" stroke="#b6cfe8"/>
  <text x="392" y="435" text-anchor="middle" fill="#334" font-size="11.5" font-weight="600">audit.py · 审计留痕</text>
  <text x="392" y="451" text-anchor="middle" fill="#778" font-size="10.5">aud 哈希链 + 双向溯源</text>
  <rect x="504" y="418" width="196" height="46" rx="6" fill="#fff" stroke="#b6cfe8"/>
  <text x="602" y="435" text-anchor="middle" fill="#334" font-size="11.5" font-weight="600">seed.py · 种子数据</text>
  <text x="602" y="451" text-anchor="middle" fill="#778" font-size="10.5">规则/维度/初始 admin</text>

  <!-- api 接口层 -->
  <rect x="70" y="494" width="840" height="38" rx="8" fill="#eef4fb" stroke="#b6cfe8"/>
  <text x="490" y="518" text-anchor="middle" fill="#2f5f9e" font-size="12" font-weight="600">接口层 api/ · auth ingest review push trace dashboard settings ｜ 基础设施 core/ · security retry</text>

  <!-- ============ 数据库 ============ -->
  <rect x="40" y="578" width="900" height="116" rx="10" fill="#ffffff" stroke="#5b7fb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="60" y="604" fill="#1f3a68" font-size="14" font-weight="700">数据库（分层五库建模）</text>
  <rect x="70" y="618" width="196" height="34" rx="6" fill="#eef6ee" stroke="#9fc79f"/>
  <text x="168" y="632" text-anchor="middle" fill="#3a6b3a" font-size="11.5" font-weight="600">ods 原始层</text>
  <text x="168" y="646" text-anchor="middle" fill="#688" font-size="10">bank_raw_flow</text>
  <rect x="278" y="618" width="196" height="34" rx="6" fill="#eef4fb" stroke="#b6cfe8"/>
  <text x="376" y="632" text-anchor="middle" fill="#2f5f9e" font-size="11.5" font-weight="600">dwd 明细层</text>
  <text x="376" y="646" text-anchor="middle" fill="#688" font-size="10">flow/validation/batch</text>
  <rect x="486" y="618" width="196" height="34" rx="6" fill="#f4efee" stroke="#d0b9b2"/>
  <text x="584" y="632" text-anchor="middle" fill="#7a5a50" font-size="11.5" font-weight="600">dim 维度层</text>
  <text x="584" y="646" text-anchor="middle" fill="#688" font-size="10">bank/subject/mapping/rule</text>
  <rect x="70" y="660" width="196" height="28" rx="6" fill="#fff3e3" stroke="#e3c28a"/>
  <text x="168" y="678" text-anchor="middle" fill="#8a5a22" font-size="11.5" font-weight="600">biz 业务状态</text>
  <rect x="278" y="660" width="196" height="28" rx="6" fill="#f7e6ea" stroke="#d8a4b0"/>
  <text x="376" y="678" text-anchor="middle" fill="#8a3a4e" font-size="11.5" font-weight="600">aud 审计层（哈希链）</text>
  <text x="920" y="630" text-anchor="end" fill="#5b7fb0" font-size="10.5">生产：独立 MySQL 8.0（隔离内网）</text>
  <text x="920" y="646" text-anchor="end" fill="#8a94a6" font-size="10.5">演示：SQLite waterflow.db</text>

  <!-- ============ 前端 ============ -->
  <rect x="40" y="726" width="900" height="70" rx="10" fill="#ffffff" stroke="#5b7fb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="60" y="752" fill="#1f3a68" font-size="14" font-weight="700">前端 Web 复核台 · backend/web/</text>
  <text x="60" y="772" fill="#446" font-size="12">自包含 ES Module + 原生 JS · 零构建 · 零外部依赖 · 内网可用 · 由 FastAPI 静态托管</text>
  <text x="60" y="788" fill="#8a94a6" font-size="11">login / 复核工作台 / 溯源 / 四看板 / 系统设置（设置页为只读对接状态）</text>

  <!-- 数据流箭头 -->
  <g stroke="#8a94a6" stroke-width="1.6" fill="none">
    <line x1="235" y1="168" x2="235" y2="252" marker-end="url(#arr)"/>
    <line x1="745" y1="168" x2="745" y2="252" marker-end="url(#arr)"/>
    <line x1="490" y1="532" x2="490" y2="572" marker-end="url(#arr)"/>
  </g>
  <text x="222" y="218" fill="#3a6b3a" font-size="10.5">采集 HTTP</text>
  <text x="708" y="212" fill="#8a3a4e" font-size="10.5">推送/制证</text>
  <text x="500" y="566" fill="#3a6b3a" font-size="10.5">SQLAlchemy 读写</text>
</svg>